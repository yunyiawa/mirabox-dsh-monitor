<!DOCTYPE HTML>
<html>

<head>
	<title>DSH Monitor 设置</title>
	<meta charset="utf-8" />
	<style>
		body {
			margin: 0;
			padding: 12px;
			background: #2d2d2d;
			color: #e2e8f0;
			font-family: "Microsoft YaHei", sans-serif;
			font-size: 13px;
		}

		.row {
			display: flex;
			align-items: center;
			margin-bottom: 10px;
		}

		.row>label {
			width: 88px;
			color: #94a3b8;
			flex: none;
		}

		.row select,
		.row input[type=number],
		.row input[type=password],
		.row input[type=text] {
			flex: 1;
			min-width: 0;
			background: #1e1e1e;
			border: 1px solid #3f3f3f;
			color: #e2e8f0;
			padding: 5px 7px;
			border-radius: 4px;
		}

		.row input[type=checkbox] {
			width: 16px;
			height: 16px;
		}

		.keywrap {
			display: flex;
			flex: 1;
			gap: 6px;
			min-width: 0;
		}

		.keywrap input {
			flex: 1;
			min-width: 0;
		}

		button {
			background: #203170;
			color: #dbeafe;
			border: 1px solid #35509c;
			border-radius: 4px;
			padding: 5px 10px;
			cursor: pointer;
			font-size: 12px;
			flex: none;
		}

		button:hover {
			background: #2a4189;
		}

		.status {
			margin-top: 8px;
			font-size: 12px;
			min-height: 16px;
		}

		.ok {
			color: #22c55e;
		}

		.err {
			color: #ef4444;
		}

		.hint {
			color: #64748b;
			font-size: 12px;
			line-height: 1.6;
			margin-top: 14px;
			border-top: 1px solid #3f3f3f;
			padding-top: 10px;
		}

		code {
			color: #7dd3fc;
		}

		.warn {
			color: #f59e0b;
		}
	</style>
</head>

<body>
	<div class="row">
		<label>API Key</label>
		<div class="keywrap">
			<input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
			<button id="toggle" type="button" title="显示/隐藏">👁</button>
		</div>
	</div>
	<div class="row">
		<label></label>
		<button id="test" type="button">测试连接</button>
	</div>
	<div class="status" id="status"></div>

	<div class="row">
		<label>峰谷文案</label>
		<select id="periodMode">
			<option value="liangwen">梁文峰 / 梁文谷</option>
			<option value="plain">高峰时段 / 空闲时段</option>
			<option value="qiangqiang">!?峰峰?! / !?谷谷?!</option>
		</select>
	</div>
	<div class="row">
		<label>刷新间隔</label>
		<input id="refreshSec" type="number" min="10" max="3600" />
	</div>
	<div class="row">
		<label>今日已用</label>
		<input id="showToday" type="checkbox" />
	</div>
	<div class="row">
		<label>赠送/充值</label>
		<input id="showDetail" type="checkbox" />
	</div>

	<div class="hint">
		直接调用 DeepSeek 官方余额接口 <code>api.deepseek.com/user/balance</code>，<b>不再需要 DSH</b>。<br />
		API Key 在 <a href="#" id="getkey" style="color:#7dd3fc">platform.deepseek.com</a> 的「API keys」页面创建。<br />
		<br />
		<span class="warn">⚠ 注意</span>：Key 会以<b>明文</b>保存在 MiraBox Craft 的主题配置里，
		请不要在这台机器以外复用同一个 Key。<br />
		<br />
		「今日已用」是本地记账：累加余额的下降量。<b>控件没运行时发生的消耗统计不到。</b><br />
		更新 Key 后若仍显示旧状态，点一下控件即可立即刷新。
	</div>

	<script>
		let websocket = null;
		let pluginUUID = null;
		/* 保存完整配置，改单项时合并回去，避免把 ActionGeometry / 记账数据冲掉 */
		let current = {};

		function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo) {
			pluginUUID = inPluginUUID;
			websocket = new WebSocket("ws://127.0.0.1:" + inPort);

			websocket.onopen = function () {
				websocket.send(JSON.stringify({ uuid: inPluginUUID, event: inRegisterEvent }));
				websocket.send(JSON.stringify({ event: "getSettings", context: inPluginUUID }));
			};

			websocket.onmessage = function (e) {
				const data = JSON.parse(e.data);
				if (data.event === "didReceiveSettings" && data.payload && data.payload.settings) {
					current = data.payload.settings;
					fill(current);
				}
			};
		}

		const $ = (id) => document.getElementById(id);

		function fill(s) {
			$("apiKey").value = s.apiKey || "";
			$("periodMode").value = s.periodMode || "liangwen";
			$("refreshSec").value = s.refreshSec || 60;
			$("showToday").checked = s.showToday !== false;
			$("showDetail").checked = s.showDetail !== false;
		}

		function push() {
			if (!websocket) return;
			const next = Object.assign({}, current, {
				apiKey: $("apiKey").value.trim(),
				periodMode: $("periodMode").value,
				refreshSec: parseInt($("refreshSec").value) || 60,
				showToday: $("showToday").checked,
				showDetail: $("showDetail").checked
			});
			current = next;
			websocket.send(JSON.stringify({
				event: "setSettings",
				context: pluginUUID,
				payload: next
			}));
		}

		["periodMode", "refreshSec", "showToday", "showDetail"].forEach(function (id) {
			$(id).addEventListener("change", push);
			$(id).addEventListener("input", push);
		});

		/* Key 用防抖，避免每敲一个字符就写一次设置 */
		let keyTimer = null;
		$("apiKey").addEventListener("input", function () {
			if (keyTimer) clearTimeout(keyTimer);
			keyTimer = setTimeout(function () { push(); setStatus("", ""); }, 600);
		});

		$("toggle").addEventListener("click", function () {
			const el = $("apiKey");
			el.type = el.type === "password" ? "text" : "password";
		});

		$("getkey").addEventListener("click", function (ev) {
			ev.preventDefault();
			if (websocket) {
				websocket.send(JSON.stringify({
					event: "openUrl",
					payload: { url: "https://platform.deepseek.com/api_keys" }
				}));
			}
		});

		function setStatus(text, cls) {
			const el = $("status");
			el.textContent = text;
			el.className = "status " + (cls || "");
		}

		/* 属性面板自己直接打接口，结果只用于提示，不改插件状态 */
		$("test").addEventListener("click", function () {
			const key = $("apiKey").value.trim();
			if (!key) { setStatus("请先填写 API Key", "err"); return; }
			setStatus("测试中…", "");
			const x = new XMLHttpRequest();
			x.open("GET", "https://api.deepseek.com/user/balance", true);
			x.timeout = 12000;
			x.setRequestHeader("Authorization", "Bearer " + key);
			x.setRequestHeader("Accept", "application/json");
			x.onreadystatechange = function () {
				if (x.readyState !== 4) return;
				if (x.status >= 200 && x.status < 300) {
					try {
						const j = JSON.parse(x.responseText);
						const info = (j.balance_infos || [])[0];
						if (info) {
							setStatus("✓ 连接成功：余额 " + info.currency + " " + info.total_balance, "ok");
						} else {
							setStatus("✓ 连接成功，但返回里没有余额信息", "ok");
						}
					} catch (e) {
						setStatus("返回不是合法 JSON", "err");
					}
				} else if (x.status === 401 || x.status === 403) {
					setStatus("✗ API Key 无效（HTTP " + x.status + "）", "err");
				} else {
					setStatus("✗ 请求失败（HTTP " + x.status + "）", "err");
				}
			};
			x.ontimeout = function () { setStatus("✗ 请求超时", "err"); };
			x.onerror = function () { setStatus("✗ 网络不可用或被 CORS 拦截", "err"); };
			x.send();
		});
	</script>
</body>

</html>
